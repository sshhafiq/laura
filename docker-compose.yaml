# Laura full stack: the API plus a local Temporal server for the
# durable sync/scoring workflows (laura.temporal).
#
#   docker compose up -d
#   curl localhost:8730/health
#
# Temporal UI: http://localhost:8080  ·  gRPC frontend: localhost:7233
services:
  laura:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -q .[temporal] &&
             laura --db /app/laura.db demo &&
             laura --db /app/laura.db serve --host 0.0.0.0 --port 8730"
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8730:8730"
    depends_on:
      - temporal

  postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  temporal-db:
